name: Sync Matches Cron Job

on:
  schedule:
    # Ejecutar cada 15 minutos. 
    # Puedes ajustar este valor: '*/15 * * * *' (cada 15 mins) o '0 * * * *' (cada hora).
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permite ejecutar el workflow manualmente desde la interfaz de GitHub

jobs:
  sync_matches:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de sincronización
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Error: APP_URL o CRON_SECRET no están definidos en los secretos de GitHub."
            exit 1
          fi
          
          echo "Ejecutando sincronización en $APP_URL..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" "$APP_URL/api/cron/sync-matches?secret=$CRON_SECRET")
          
          echo "HTTP Status Code: $HTTP_STATUS"
          echo "Respuesta:"
          cat response.json
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error en la petición. Revisa los logs."
            exit 1
          fi
